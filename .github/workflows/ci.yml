name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src/local_steward

      - name: Dependency check
        run: python -m pip check

      - name: Validate public export
        run: python scripts/export_public_release.py "$RUNNER_TEMP/steward-public"
